<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><meta name="apple-mobile-web-app-title" content="자두 음악 관리"><meta name="apple-mobile-web-app-capable" content="yes"><title>자두 음악 관리</title><link rel="manifest" href="./music-admin.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/music-manager.svg"><link rel="apple-touch-icon" href="./assets/music-manager-180.png"><link rel="stylesheet" href="./admin.css?v=1121ma3"></head><body>
<main class="app"><section id="login" class="login"><p class="brand">JADU</p><h1>자두 음악 관리</h1><p class="hint">관리자 Google 계정으로 로그인해 주세요.</p><p id="login-account" class="hint"></p><button id="signin" class="primary" type="button" disabled>로그인 준비 중…</button></section>
<section id="manager" hidden><header class="header"><div><p class="brand">JADU</p><h1>자두 음악 관리</h1></div><button id="signout" class="quiet" type="button">로그아웃</button></header><p id="account-email" class="hint account-email"></p>
<div id="list-view"><div id="filters" class="view-tabs" role="group" aria-label="회원 목록"><button type="button" data-status="pending" aria-pressed="true">신청 <span data-count="pending">0</span></button><button type="button" data-status="allowed" aria-pressed="false">승인 <span data-count="allowed">0</span></button><button type="button" data-status="blocked" aria-pressed="false">차단 <span data-count="blocked">0</span></button><button type="button" data-status="all" aria-pressed="false">전체 <span data-count="all">0</span></button></div>
<form id="search-form" class="search" role="search"><label class="sr-only" for="query">이름 또는 이메일 검색</label><input id="query" type="search" placeholder="이름 · 이메일" maxlength="150"><button type="submit">검색</button></form><div class="summary"><p>전체 <strong data-count="all">0</strong>명 <span id="expired-count"></span></p><button id="refresh" type="button">새로고침</button></div>
<div class="panel"><ul id="users" class="users" aria-busy="false"></ul><p id="empty" class="empty" hidden>신청 대기 중인 사용자가 없습니다.</p></div><div class="list-end"><button id="more" type="button" hidden>더 보기</button></div></div>
<section id="detail" hidden><button id="back" class="quiet" type="button">목록</button><div class="detail-title"><strong id="detail-name" class="company"></strong><span id="detail-status" class="status"></span></div><section class="panel detail-section"><h2>사용자 정보</h2><dl id="detail-info" class="info"></dl></section><section class="panel manage-actions"><h2>음악 사용 관리</h2><div class="actionbar"><button id="approve" class="primary" type="button">승인</button><button id="block" class="danger" type="button">차단</button></div></section></section>
</section><p id="message" class="notice" role="status" aria-live="polite"></p></main>
<dialog id="editor" aria-labelledby="action-title"><form id="approval-form"><header class="modal-head"><h2 id="action-title">음악 사용 승인</h2></header><div class="modal-body"><p id="approval-target" class="target"></p><fieldset><legend>사용기간</legend><div class="options period-options"><label><input type="radio" name="period" value="1" required>한 달</label><label><input type="radio" name="period" value="12">일 년</label><label><input type="radio" name="period" value="unlimited">무제한</label></div><label class="field">만료일<input id="expires" name="expires" type="date" required></label><p id="period-note" class="hint"></p></fieldset><p id="action-error" class="error" role="alert"></p></div><footer class="modal-foot"><button id="cancel" type="button">취소</button><button class="primary" type="submit">승인</button></footer></form></dialog>
<script type="module" src="./admin.mjs?v=1121ma3"></script></body></html>
