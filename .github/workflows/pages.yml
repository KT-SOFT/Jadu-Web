name: Deploy Jadu Web to Pages

# Manual deployment only, after repository/site publication is approved.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and unpack reviewed web app
        shell: bash
        run: |
          sha256sum --check Jadu-Web.zip.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("Jadu-Web.zip") as archive:
              for info in archive.infolist():
                  path = Path(info.filename)
                  if path.is_absolute() or ".." in path.parts or not info.filename.startswith("dist/"):
                      raise SystemExit("Unexpected archive path")
              archive.extractall(".")
          PY
      - name: Verify and unpack TV page
        shell: bash
        run: |
          sha256sum --check Jadu-TV.zip.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath
          destination = Path("dist/tv")
          with zipfile.ZipFile("Jadu-TV.zip") as archive:
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts or "\\\\" in info.filename:
                      raise SystemExit("Unexpected TV archive path")
              archive.extractall(destination)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload dist only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

